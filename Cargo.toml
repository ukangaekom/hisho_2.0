[package]
name = "hisho"
version = "1.0.0"
edition = "2021"
authors = ["Ekomabasi Ukagna <ekomabasiuk@gmail.com>"]
description = "A modern Mantle agent CLI for local system installation. Talk with mantle network from your terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ukangaekom/hisho_2.0"
readme = "README.md"
keywords = ["cli", "agent", "mantle", "automation"]
categories = ["command-line-utilities"]

[[bin]]
name = "hisho"
path = "src/main.rs"

#[path = "unit/chain_test.rs"]

[profile.release]
opt-level = 3       # Maximum optimization for speed
lto = true          # Link-Time Optimization to eliminate dead code across crates
codegen-units = 1   # Reduces parallel generation blocks to allow deeper optimizations
panic = "abort"     # Eliminates stack unwinding overhead for a smaller, faster binary
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
tokio = { version = "1.0", features = ["full"] } # Added for smooth async timing
crossterm = "0.27" # Added for screen clearing and cursor control
figlet-rs = "0.1"
ratatui = "0.26" # Production UI and double-buffering layout engine
viuer = "0.11.0"
dialoguer = "0.12.0"
console = "0.16.3"
inquire = "0.7"
once_cell = "1.21.3"
futures = "0.3.31"
regex = "1.11.2"

# x402 Ecosystem crates
# x402-axum = "2.0.2"    # Server middleware for gating Hisho routes
# x402-reqwest = "2.0.2" # Auto-paying client wrapper for outbound agent requests

# Wallet & Signer primitives & Cryptography
ethers = { version = "2.0", features = ["legacy", "ws", "optimism", "celo"] }
bip39 = { version = "2.0.0", features = ["zeroize"] }
zeroize = { version = "1.6.0", features = ["zeroize_derive"] }
keyring = "2.1"
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = "0.5"
machine-uid = "0.5"
rand = "0.8"
bincode = "1.3"
hex = "0.4.3"
libc = "0.2"

# Cryptography & Utilities
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
directories = "6.0.0"
reqwest = "0.13.4"
redb = "4.1.0"
genai = "0.6.5"
thiserror = "2.0.19"
eyre = "0.6.12"
alloy = "2.2.0"

# Target specific dependencies (Unix only)
[target.'cfg(unix)'.dependencies]
x402-facilitator-local = "2.0.2"

[dev-dependencies]
assert_cmd = "1"
predicates = "1"
