name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hisho
            asset_name: hisho-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hisho
            asset_name: hisho-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: hisho
            asset_name: hisho-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hisho.exe
            asset_name: hisho-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "29.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify protoc is available
        shell: bash
        run: protoc --version

      - name: Build release binary
        env:
          OPENSSL_DIR: ${{ env.OPENSSL_DIR || '' }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH || '' }}
          LIBRARY_PATH: ${{ env.LIBRARY_PATH || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*